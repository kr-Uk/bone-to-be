stages:
  - deploy

variables:
  DOCKER_DRIVER: overlay2

# ===============================
# Frontend
# ===============================
deploy_frontend:
  stage: deploy
  image: docker:latest
  only:
    refs: [ dev ]
    changes:
      - frontend/**/*
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    - |
      docker build \
        --build-arg VITE_BASE_URL=/api \
        --build-arg VITE_API_MOCKING=disabled \
        --build-arg VITE_MOCK_BASE_URL="" \
        -t $DOCKERHUB_USERNAME/frontend:latest \
        frontend
    - docker push $DOCKERHUB_USERNAME/frontend:latest
    - ssh ubuntu@$SSH_HOST "
        cd /home/ubuntu/bonetobe &&
        docker compose pull frontend &&
        docker compose up -d frontend
      "

# ===============================
# Backend
# ===============================
deploy_backend:
  stage: deploy
  image: docker:latest
  only:
    refs: [ dev ]
    changes:
      - backend/**/*
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config
  script:
    - docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
    - docker build -t $DOCKERHUB_USERNAME/backend:latest backend
    - docker push $DOCKERHUB_USERNAME/backend:latest
    - ssh ubuntu@$SSH_HOST "
        cd /home/ubuntu/bonetobe &&
        docker compose pull backend &&
        docker compose up -d backend
      "
