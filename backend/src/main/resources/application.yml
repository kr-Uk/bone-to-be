spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  ##################################
  # Datasource
  ##################################
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  ##################################
  # JPA
  ##################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ##################################
  # Mail (SMTP)
  ##################################
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:app-password}
    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  ##################################
  # SpringDoc
  ##################################

  ##################################
  # Security
  ##################################
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/google"
            scope: profile, email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope: profile_nickname, account_email
            client-name: Kakao
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            authorization-grant-type: authorization_code
            scope: name, email, profile_image
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response # 네이버는 유저 정보가 response라는 키 안에 담겨 옴

  ##################################
  # RabbitMQ
  ##################################
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10

rabbitmq:
  topology:
    analysis:
      exchange: analysis.exchange
      queues:
        request:
          name: analysis.request.queue
          routingKey: analysis.requested

        completed:
          name: analysis.completed.queue
          routingKey: analysis.completed

        failed:
          name: analysis.failed.queue
          routingKey: analysis.failed

    tryon:
      exchange: tryon.exchange
      queues:
        request:
          name: tryon.request.queue
          routingKey: tryon.requested

        completed:
          name: tryon.completed.queue
          routingKey: tryon.completed

        failed:
          name: tryon.failed.queue
          routingKey: tryon.failed


  ##################################
  # Jackson
  ##################################
  jackson:
    time-zone: Asia/Seoul

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static:
          ${AWS_REGION}

      s3:
        enabled: true
s3:
  bucket : ${AWS_S3_BUCKET}
  region : ${AWS_REGION}

##################################
# Initial Data (Admin)
##################################
init:
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:Admin1234!}

server:
  port: 8080
  servlet:
    context-path: /api
    session:
      cookie:
        http-only: true
        secure: true # HTTPS 환경이면 true
        same-site: none # 프론트-백 도메인이 다르면 필수
        path: /

##################################
# Logging
##################################
logging:
  level:
    root: INFO
    com.bonetobe.backend: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG

##################################
# Actuator
##################################
management:
  endpoints:
    web:
      exposure:
        include: health,info