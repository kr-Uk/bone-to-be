spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  ##################################
  # Datasource
  ##################################
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  ##################################
  # JPA
  ##################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ##################################
  # Mail (SMTP)
  ##################################
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:app-password}
    default-encoding: UTF-8

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  ##################################
  # SpringDoc
  ##################################

  ##################################
  # RabbitMQ
  ##################################
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}

    listener:
      simple:
        acknowledge-mode: manual
        concurrency: 3
        max-concurrency: 10
        prefetch: 10

  ##################################
  # Jackson
  ##################################
  jackson:
    time-zone: Asia/Seoul

  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION:ap-northeast-2} # 중복 제거 및 기본값 적용
      s3:
        enabled: false
      stack:
        auto: false
s3:
  bucket : ${AWS_S3_BUCKET}
  region : ${AWS_REGION}

##################################
# Initial Data (Admin)
##################################
init:
  admin:
    email: ${ADMIN_EMAIL:admin@example.com}
    password: ${ADMIN_PASSWORD:Admin1234!}

server:
  port: 8080
  servlet:
    context-path: /api

##################################
# Logging
##################################
logging:
  level:
    root: INFO
    com.bonetobe.backend: DEBUG

##################################
# Actuator
##################################
management:
  endpoints:
    web:
      exposure:
        include: health,info