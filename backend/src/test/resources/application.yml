spring:
  config:
    activate:
      on-profile: test

  ##################################
  # Datasource (H2 In-Memory)
  ##################################
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  ##################################
  # JPA
  ##################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: true

  ##################################
  # H2 Console (test only)
  ##################################
  h2:
    console:
      enabled: true
      path: /h2-console

  ##################################
  # SQL Init
  ##################################
  sql:
    init:
      mode: never

  ##################################
  # Redis (비활성)
  ##################################
  data:
    redis:
      repositories:
        enabled: false

  ##################################
  # Mail (실제 전송 방지)
  ##################################
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

  ##################################
  # RabbitMQ (listener 비활성)
  ##################################
  rabbitmq:
    listener:
      simple:
        auto-startup: false

##################################
# Logging
##################################
logging:
  level:
    root: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

##################################
# Actuator (test 비활성)
##################################
management:
  endpoints:
    enabled-by-default: false