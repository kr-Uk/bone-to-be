version: "3.9"

services:

  # ===============================
  # Backend (Spring Boot)
  # ===============================
  backend:
    image: backend:latest
    container_name: bonetobe-backend
    restart: always

    environment:
      SPRING_PROFILES_ACTIVE: prod

      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bonetobe
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

    ports:
      - "8988:8080"

    networks:
      - bonetobe-net


  # ===============================
  # Frontend (React + Nginx)
  # ===============================
  frontend:
    image: frontend:latest
    container_name: bonetobe-frontend
    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"

    networks:
      - bonetobe-net


  # ===============================
  # PostgreSQL
  # ===============================
  postgres:
    image: postgres:15
    container_name: bonetobe-postgres
    restart: always

    environment:
      POSTGRES_DB: bonetobe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    networks:
      - bonetobe-net


  # ===============================
  # Redis
  # ===============================
  redis:
    image: redis:7
    container_name: bonetobe-redis
    restart: always

    ports:
      - "6379:6379"

    networks:
      - bonetobe-net


  # ===============================
  # Nginx (Reverse Proxy)
  # ===============================
  nginx:
    image: nginx:1.25-alpine
    container_name: bonetobe-nginx
    restart: always

    depends_on:
      - frontend
      - backend

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

    networks:
      - bonetobe-net


  # ===============================
  # Certbot (HTTPS)
  # ===============================
  certbot:
    image: certbot/certbot
    container_name: bonetobe-certbot

    volumes:
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot

    entrypoint: >
      sh -c "trap exit TERM;
             while :;
             do
               certbot renew;
               sleep 12h & wait $${!};
             done"

    networks:
      - bonetobe-net


# ===============================
# Volumes
# ===============================
volumes:
  postgres-data:


# ===============================
# Network
# ===============================
networks:
  bonetobe-net:
    driver: bridge
